# Alembic 迁移配置: 数据库连接串由 alembic/env.py 从 app.core.config.settings 读取,
# 初始化: .venv/bin/alembic init alembic
# 生成迁移: .venv/bin/alembic revision --autogenerate -m "描述"
# 升级:     .venv/bin/alembic upgrade head
# 回滚:     .venv/bin/alembic downgrade base
# 说明: sqlalchemy.url 留空, 统一在 env.py 里设置, 避免密码出现在版本库里.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
