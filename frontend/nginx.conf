server {
    listen 80;
    server_name _;

    # 单文件上传上限的唯一来源是后端「系统设置 → 单文件上传大小上限」
    # (app/shared/upload_policy.py 读 system_config.max_upload_size_mb)。
    # 这里不设固定 50m: 管理端把上限调到 50MB 以上时, nginx 会先回 413,
    # 配置看起来"存下来了却没生效"。0 = 不做本地检查, 交给后端统一判定,
    # 若要网关层兜底, 取值必须 >= 管理端允许的最大值(2048MB)。
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # 前端静态资源(Vue Router history 模式)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理 → backend 容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;  # SSE 流式响应不缓冲
    }
}
